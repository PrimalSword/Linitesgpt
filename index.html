<head>
<meta charset="utf-8">

<title>LimitesGPT Bridge Probe</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#0f1115;color:#f3f4f6;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(620px,100%);background:#171a20;border:1px solid #303640;border-radius:18px;padding:20px}h1{font-size:22px;margin:0 0 8px}p{color:#aeb6c2;line-height:1.5}#log{margin-top:16px;padding:12px;border-radius:12px;background:#101318;line-height:1.7;font-size:14px;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<h1>LimitesGPT · Bridge Probe</h1>
<p>Teste de ligação entre uma página externa e o App Block do ChatGPT. Esta página não acessa arquivos locais.</p>
<div id="log">⏳ Iniciando…</div>
</main>
<script>
(()=>{
 const token=new URLSearchParams(location.search).get('token')||'';
 const hasOpener=!!window.opener;
 const lines=[
  (hasOpener?'✅':'❌')+' window.opener: '+(hasOpener?'presente':'ausente'),
  (isSecureContext?'✅':'❌')+' secure context: '+isSecureContext,
  '🌐 origem: '+location.origin
 ];
 document.getElementById('log').textContent=lines.join('\n');
 if(hasOpener){
  try{window.opener.postMessage({type:'limitesgpt-bridge',token,op:'hello',origin:location.origin},'*')}catch(e){}
 }
})();
</script>
</body>
</html>
