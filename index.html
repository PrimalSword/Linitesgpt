<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LimitesGPT Bridge</title>
<style>body{font-family:system-ui;background:#0f1115;color:#f3f4f6;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(620px,100%);background:#171a20;border:1px solid #303640;border-radius:18px;padding:20px}button{width:100%;min-height:52px;border:1px solid #3d4653;border-radius:13px;background:#242a33;color:#fff;font-weight:800;margin-top:10px}#log{margin-top:14px;padding:12px;border-radius:12px;background:#101318;line-height:1.65;white-space:pre-wrap}</style>
</head>
<body><main><h2>LimitesGPT · Persistent Bridge</h2><p id="desc">Ponte entre o Chrome e o App Block do ChatGPT.</p><button id="pick">📁 ESCOLHER PASTA</button><button id="connect">🌉 CONECTAR AO HANDLE SALVO</button><div id="log">⏳ Inicializando…</div></main>
<script>
(()=>{const L=document.getElementById('log'),P=document.getElementById('pick'),C=document.getElementById('connect'),embedded=top!==self,DB='limitesgpt-bridge',STORE='handles',KEY='root';
function openDB(factory=indexedDB){return new Promise((ok,no)=>{const r=factory.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function save(h){const d=await openDB();return new Promise((ok,no)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(h,KEY);t.oncomplete=()=>{d.close();ok()};t.onerror=()=>no(t.error)})}
async function load(factory=indexedDB){const d=await openDB(factory);return new Promise((ok,no)=>{const t=d.transaction(STORE,'readonly'),r=t.objectStore(STORE).get(KEY);r.onsuccess=()=>{d.close();ok(r.result||null)};r.onerror=()=>no(r.error)})}
async function report(h,p,extra=''){L.textContent=(embedded?'🌉 modo iframe':'🌐 modo top-level')+'\n'+(h?'✅ handle salvo: '+h.name:'❌ nenhum handle salvo')+'\n🔐 permissão: '+p+(extra?'\n'+extra:'');if(parent&&parent!==window)parent.postMessage({type:'LGT_BRIDGE_RESULT',hasHandle:!!h,name:h?.name||null,permission:p,extra},'*')}
async function normalStatus(){const h=await load();let p='missing';if(h){try{p=await h.queryPermission({mode:'read'})}catch(e){p='error'}}await report(h,p);return{h,p}}
P.hidden=embedded;C.hidden=!embedded;
P.onclick=async()=>{try{const h=await showDirectoryPicker({mode:'read'});await save(h);let p=await h.queryPermission({mode:'read'});await report(h,p,'🔥 PONTE ARMADA. Volte ao ChatGPT.')}catch(e){L.textContent='💀 '+(e?.message||String(e))}};
C.onclick=async()=>{try{if(!document.requestStorageAccess)throw Error('Storage Access API não disponível');L.textContent='⏳ Pedindo acesso ao IndexedDB não particionado…';const sa=await document.requestStorageAccess({indexedDB:true});if(!sa||!sa.indexedDB)throw Error('StorageAccessHandle sem indexedDB');const h=await load(sa.indexedDB);if(!h)throw Error('handle não encontrado no IndexedDB original');let p='unknown';try{p=await h.queryPermission({mode:'read'})}catch(e){p='error'};await report(h,p,'🔥 HANDLE RECUPERADO DENTRO DO IFRAME');}catch(e){L.textContent='💀 '+(e?.message||String(e));parent?.postMessage({type:'LGT_BRIDGE_RESULT',error:e?.message||String(e)},'*')}};
if(embedded){L.textContent='🌉 modo iframe\nToque em CONECTAR AO HANDLE SALVO.'}else normalStatus().catch(e=>L.textContent='💀 '+e.message);
})();
</script></body></html>
