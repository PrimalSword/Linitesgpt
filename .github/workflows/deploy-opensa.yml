name: Deploy OpenSA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-opensa.yml"
      - "OPENSA-NOTICE.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenSA source snapshot
        uses: actions/checkout@v4
        with:
          repository: AlexSergey/opensa-fork-notice
          ref: main
          path: opensa

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: opensa/package-lock.json

      - name: Install dependencies
        working-directory: opensa
        run: npm ci

      - name: Build browser app for this Pages path
        working-directory: opensa
        run: npm run build:prod -- --base=/Linitesgpt/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: opensa/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
